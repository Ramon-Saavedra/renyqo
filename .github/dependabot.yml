version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "babel-plugin-react-compiler"
      testing:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@vitejs/*"
          - "@testing-library/*"
          - "jsdom"
          - "playwright"
      lint:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "eslint"
          - "eslint-config-prettier"
          - "prettier"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
